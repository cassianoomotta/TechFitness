name: Resumo diário do treinador
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Calcular resumo no TechFitness
        shell: bash
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=techfitness-trainer-summary" | jq -er .value)
          echo "::add-mask::$token"
          curl --fail-with-body --retry 3 --max-time 45 -X POST \
            -H "Authorization: Bearer $token" \
            https://tech-fitness.vercel.app/api/cron/trainer-summary
